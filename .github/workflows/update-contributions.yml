name: Update contribution archive

on:
  schedule:
    # Every month on the 1st at 09:17 JST (00:17 UTC).
    - cron: '28 6 1 * *'
  workflow_dispatch:
    inputs:
      github_user:
        description: 'GitHub user; leave empty to use the repository owner'
        type: string
        required: false
        default: ''
  push:
    branches-ignore: [contribution-graphs]
    paths:
      - '.github/workflows/update-contributions.yml'
      - 'scripts/**'
      - 'templates/**'

permissions:
  contents: read

concurrency:
  group: contribution-archive-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CONTRIBUTION_USER: ${{ inputs.github_user || vars.CONTRIBUTION_USER || github.repository_owner }}
      START_YEAR: ${{ vars.START_YEAR }}
      OUTPUT_BRANCH: contribution-graphs
      CONTRIBUTION_SOURCE: ${{ vars.CONTRIBUTION_SOURCE || 'auto' }}
    steps:
      - name: Check out the template source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate optional external deployment settings
        env:
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: python scripts/deploy.py --check-config
      - name: Install the Actions cache client
        run: npm install --prefix "$RUNNER_TEMP/contribution-cache-tools" --no-audit --no-fund --ignore-scripts @actions/cache@6.3.0
      - name: Restore historical year JSON files from Actions cache
        uses: actions/github-script@v8
        with:
          script: |
            const cache = require(`${process.env.RUNNER_TEMP}/contribution-cache-tools/node_modules/@actions/cache`);
            await require('./scripts/history_cache.cjs')({github, core, cache}, 'restore');
      - name: Install the SVG to PNG renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y inkscape fonts-liberation
      - name: Set up ImageMagick 7
        uses: mfinelli/setup-imagemagick@v8
      - name: Generate SVG, HTML and data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate.py --output dist --cache-dir .cache/contributions
      - name: Save historical year JSON files to Actions cache
        uses: actions/github-script@v8
        with:
          script: |
            const cache = require(`${process.env.RUNNER_TEMP}/contribution-cache-tools/node_modules/@actions/cache`);
            await require('./scripts/history_cache.cjs')({github, core, cache}, 'save');
      - name: Restore activity snapshot from Actions cache
        uses: actions/github-script@v8
        with:
          script: |
            const cache = require(`${process.env.RUNNER_TEMP}/contribution-cache-tools/node_modules/@actions/cache`);
            await require('./scripts/activity_cache.cjs')({core, cache}, 'restore');
      - name: Generate independent activity cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/activity.py --directory dist
      - name: Save activity snapshot to Actions cache
        uses: actions/github-script@v8
        with:
          script: |
            const cache = require(`${process.env.RUNNER_TEMP}/contribution-cache-tools/node_modules/@actions/cache`);
            await require('./scripts/activity_cache.cjs')({core, cache}, 'save');
      - name: Render activity PNGs
        run: python scripts/activity.py --directory dist --render
      - name: Render the light and dark PNGs
        run: python scripts/render_images.py --directory dist
      - name: Encode lossless WebP images
        working-directory: dist
        run: |
          magick mogrify -format webp -quality 100 -define webp:lossless=true -define webp:method=6 -define webp:exact=true profile-dark.png profile-light.png
          magick mogrify -format webp -quality 100 -define webp:lossless=true -define webp:method=6 -define webp:exact=true profile-dark3.png profile-light3.png
          magick compare -metric AE profile-dark.png profile-dark.webp null:
          magick compare -metric AE profile-light.png profile-light.webp null:
          magick compare -metric AE profile-dark3.png profile-dark3.webp null:
          magick compare -metric AE profile-light3.png profile-light3.webp null:
      - name: Encode lossless activity WebP images
        working-directory: dist
        run: |
          magick mogrify -format webp -quality 100 -define webp:lossless=true -define webp:method=6 -define webp:exact=true activity-dark.png activity-light.png activity-dark3.png activity-light3.png
          for stem in activity-dark activity-light activity-dark3 activity-light3; do
            magick compare -metric AE "$stem.png" "$stem.webp" null:
          done
      - name: Build the standalone profile dialog
        run: python scripts/render_dialog.py --directory dist
      - name: Publish files to the dedicated branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python scripts/publish.py
          --directory dist
          --branch "$OUTPUT_BRANCH"
          --default-branch "$DEFAULT_BRANCH"
      - name: Publish to the optional destination repository
        env:
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: python scripts/deploy.py --directory dist
      - name: Show the README images and embed snippet
        env:
          DEPLOY_REPOSITORY: ${{ vars.DEPLOY_REPOSITORY }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
        run: |
          python - <<'PY'
          import os
          from scripts.generate import embed_markdown
          import sys
          sys.path.insert(0, "scripts")
          from activity import activity_embed
          repository = os.environ.get('DEPLOY_REPOSITORY') or os.environ['GITHUB_REPOSITORY']
          branch = os.environ.get('DEPLOY_BRANCH') or os.environ['OUTPUT_BRANCH']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(embed_markdown(repository, branch))
              summary.write(activity_embed(repository, branch))
          PY
      - name: Upload the optional Pages site
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: vars.ENABLE_PAGES == 'true'
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the same generated HTML
        id: deployment
        uses: actions/deploy-pages@v4
