<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__PROFILE_USER__ · Contributions</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1f2328;--border:#d1d9e0}@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#f0f6fc;--border:#3d444d}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.preview{display:block;width:min(800px,100%);padding:0;margin:16px auto;border:0;background:transparent;cursor:zoom-in}.preview img{display:block;width:100%;height:auto;max-height:600px;object-fit:contain;object-position:top}.preview:focus-visible,button:focus-visible{outline:2px solid #0969da;outline-offset:4px}dialog{width:min(840px,96vw);max-width:96vw;max-height:92vh;padding:0;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);overflow:auto}dialog::backdrop{background:#0009}.toolbar{position:sticky;top:0;z-index:1;display:flex;justify-content:flex-end;background:var(--bg);padding:6px}.close{border:1px solid var(--border);border-radius:6px;padding:2px 12px;background:var(--bg);color:var(--fg);font:22px/1.4 sans-serif;cursor:pointer}.full img{display:block;width:100%;height:auto}.full{display:block}
</style>
</head>
<body>
<button class="preview" id="open-profile" type="button" aria-label="__PROFILE_USER__の活動履歴全体を開く" aria-haspopup="dialog" aria-controls="profile-dialog">
<picture>
<source media="(prefers-color-scheme: dark)" srcset="__DARK_PREVIEW__">
<source media="(prefers-color-scheme: light)" srcset="__LIGHT_PREVIEW__">
<img src="__LIGHT_PREVIEW__" width="800" height="600" alt="__PROFILE_USER__ GitHub contributions">
</picture>
</button>
<dialog id="profile-dialog" aria-label="__PROFILE_USER__の活動履歴全体">
<div class="toolbar"><button class="close" id="close-profile" type="button" aria-label="閉じる" autofocus>×</button></div>
<picture class="full">
<source media="(prefers-color-scheme: dark)" srcset="__DARK_FULL__">
<source media="(prefers-color-scheme: light)" srcset="__LIGHT_FULL__">
<img src="__LIGHT_FULL__" width="1600" alt="__PROFILE_USER__ GitHub contributions">
</picture>
</dialog>
<script>
const profileDialog=document.getElementById('profile-dialog');
document.getElementById('open-profile').addEventListener('click',()=>{
 profileDialog.showModal();
 profileDialog.scrollTop=0;
 document.documentElement.style.overflow='hidden';
});
document.getElementById('close-profile').addEventListener('click',()=>profileDialog.close());
profileDialog.addEventListener('click',event=>{if(event.target===profileDialog)profileDialog.close()});
profileDialog.addEventListener('close',()=>{document.documentElement.style.overflow=''});
</script>
</body>
</html>
